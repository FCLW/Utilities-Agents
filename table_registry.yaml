# Centralized BigQuery Data Governance Registry
# 
# This registry maps every agent across all sub-domains to its dedicated 
# BigQuery datasets, tables, partition keys, schema definitions, and required access levels.

agents:
  ami_interval_data_vee_processor:
    agent_name: Ami Interval Data Vee Processor
    datasets:
    - access_level: roles/bigquery.dataViewer
      dataset_id: utilities_data
      location: ${GOOGLE_CLOUD_LOCATION}
      tables:
      - description: Stores analytical logs and telemetry for ami interval data vee
          processor
        partitioning:
          field: event_timestamp
          type: DAY
        table_id: ami_interval_data_vee_processor_logs
