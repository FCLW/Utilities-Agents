[project]
name = "enterprise-agents-suite"
version = "0.1.0"
description = "Enterprise Agents Suite using Google ADK"
requires-python = ">=3.11"
dependencies = [
    "google-adk[gcp]>=2.0.0",
    "fastapi",
    "pydantic-settings",
    "pydantic",
    "uvicorn",
    "pyyaml",
    "httpx",
    "google-auth",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-exporter-gcp-trace",
    "google-cloud-bigquery",
    "pandas",
    "db-dtypes",
    "google-cloud-modelarmor>=0.7.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

