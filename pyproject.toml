[project]
name = "enterprise-agents-suite"
version = "0.1.0"
description = "Enterprise Agents Suite using Google ADK"
requires-python = ">=3.11"
dependencies = [
    "google-adk[gcp]>=2.0.0",
    "fastapi",
    "pydantic-settings",
    "pydantic",
    "uvicorn",
    "pyyaml",
    "httpx",
    "google-auth",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-exporter-gcp-trace",
    "google-cloud-bigquery",
    "pandas",
    "db-dtypes",
    "google-cloud-modelarmor>=0.7.0",
    "google-cloud-logging>=3.11.0",
    "google-cloud-trace>=1.15.0",
    "google-cloud-monitoring>=2.21.0",
    "opentelemetry-exporter-gcp-logging>=1.7.0",
    "opentelemetry-exporter-gcp-monitoring>=1.7.0",
    "opentelemetry-instrumentation-google-genai>=1.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--import-mode=importlib -W ignore::DeprecationWarning"
testpaths = ["agents"]
asyncio_mode = "auto"

