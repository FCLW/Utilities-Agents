prompts:
- Are piezometer hydrostatic uplift pressures on the spillway foundation of Dam Unit
  2 within FERC safety margins?
- Review the 6-month inclinometer tilt drift and seismic accelerometer readings for
  the main concrete gravity abutment.
- What is the structural risk index of the dam under a simulated 100-year probable
  maximum precipitation (PMP) event?
- Trigger an automated sluice gate relief sequence and alert the dam safety engineer
  of abnormal foundation uplift.
