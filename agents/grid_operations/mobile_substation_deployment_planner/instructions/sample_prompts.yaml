prompts:
- Can a 25 MVA mobile substation be transported and interconnected at Substation South
  before Transformer T-1 fails completely?
- Evaluate highway bridge weight restrictions and physical substation bay footprint
  clearances for the mobile unit transport.
- What is the outage risk duration for 8,500 customers if mobile substation deployment
  is delayed by more than 12 hours?
- Authorize immediate transit dispatch of Mobile Substation Unit Alpha and prepare
  physical interconnect leads at Substation South.
