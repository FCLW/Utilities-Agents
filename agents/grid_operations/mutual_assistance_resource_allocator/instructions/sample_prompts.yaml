prompts:
- How many external mutual assistance line contractor crews should we request through
  the Regional Mutual Assistance Group (RMAG)?
- Track contractor staging yard logistics, hotel accommodations, and fuel supply allocations
  for 250 incoming utility personnel.
- What is the estimated cost-per-restored-customer for mutual assistance forces versus
  internal utility crew deployments?
- Submit formal RMAG mutual aid mobilization request for 40 bucket trucks, 15 digger
  derricks, and 80 qualified linemen.
