prompts:
- How many broken poles and downed distribution wire spans will the incoming Category
  2 hurricane cause in Coastal Division?
- Run Monte Carlo damage simulations combining 65 mph wind gust forecasts, soil moisture
  saturation, and tree canopy density.
- What are the anticipated materials requirements (transformers, crossarms, conductor
  reels) for post-storm reconstruction?
- Pre-stage emergency inventory materials and staging yards in District 3 based on
  predicted high-impact damage clusters.
