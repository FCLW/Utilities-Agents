prompts:
- Does the electrical flash burn suffered by a line technician during cable splicing
  meet the criteria for an OSHA Recordable Incident?
- Analyze days away, restricted, or transferred (DART) rate and Total Recordable Incident
  Rate (TRIR) across field operations.
- 'What are the leading root causes identified in recent high-potential near-miss
  reports: PPE non-compliance or situational fatigue?'
- Submit the certified OSHA 300 log entry and initiate a comprehensive root-cause
  safety stand-down review for District West.
