prompts:
- Did NOx or SO2 continuous emissions monitoring (CEMS) readings at Generating Station
  Unit 1 exceed EPA 40 CFR Part 75 hourly limits?
- Audit daily CEMS calibration drift test logs and relative accuracy test audits (RATA)
  across fossil generation smokestacks.
- What is our cumulative quarterly carbon and sulfur allowance balance compared to
  total verified plant emissions?
- Compile and sign the quarterly electronic EPA CEMS compliance data report for submission
  to the Clean Air Markets Division.
