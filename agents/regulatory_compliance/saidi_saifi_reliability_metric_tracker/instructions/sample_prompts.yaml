prompts:
- What are our year-to-date System Average Interruption Duration Index (SAIDI) and
  Frequency Index (SAIFI) numbers across all districts?
- Evaluate the reliability impact of Major Event Days (MED) excluded under IEEE 1366
  2.5-Beta methodology versus normal storm days.
- Are any operating divisions at risk of violating state PUC reliability performance
  benchmarks and incurring financial disallowances?
- Publish the official monthly distribution reliability scorecard to grid operations
  leadership and regulatory compliance teams.
