prompts:
- Are electric plant in service balances and depreciation reserve schedules reconciled
  for the upcoming annual FERC Form 1 filing?
- Audit regulatory asset accounting and utility operating expenses against the FERC
  Uniform System of Accounts (USofA).
- What are the major capital expenditure variances between authorized rate base filings
  and actual capital asset additions?
- Compile the completed FERC Form 1 financial schedules and balance sheets for executive
  CFO sign-off.
