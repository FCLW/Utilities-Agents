prompts:
- Does the commercial solar Power Purchase Agreement (PPA) include standard clauses
  for curtailment risk and negative pricing indemnity?
- Analyze contractual availability guarantees, heat rate degradation terms, and environmental
  attribute transfer rules.
- What is the utility's financial liability exposure if transmission interconnection
  delays trigger contract liquidated damages?
- Flag non-standard indemnification language in Section 14.2 of the Wind PPA and route
  to General Counsel for legal revision.
