prompts:
- How do the three vendor competitive proposals for our 500kV optical ground wire
  (OPGW) procurement rank against technical criteria?
- Evaluate vendor manufacturing warranties, delivery lead times, price per kilometer,
  and cybersecurity supply chain audits.
- What is the lifecycle cost differential between Vendor A's domestic offering and
  Vendor B's overseas procurement option?
- Generate the procurement bid evaluation matrix and submit the vendor award recommendation
  to the utility procurement committee.
