prompts:
- Which rate plan will minimize my monthly electric costs if I charge an EV with a
  75 kWh battery exclusively overnight?
- Compare projected annual energy expenses under the Standard Residential Tier versus
  the EV Time-of-Use Plan.
- What is the breakeven monthly mileage threshold where switching to a dedicated EV
  rate becomes financially advantageous?
- 'Switch Customer Account #773829 to the EV-TOU rate schedule effective with the
  upcoming meter billing cycle.'
