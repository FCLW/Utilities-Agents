prompts:
- What are current compliance Class I Renewable Energy Certificates (RECs) trading
  for in the voluntary and compliance markets?
- Track our portfolio surplus REC generation inventory across wind and solar assets
  against state RPS compliance obligations.
- What is the revenue upside of selling 100,000 unbundled wind RECs on the spot market
  versus banking them for future compliance years?
- Execute a bilateral sale contract of 25,000 Class 1 Green-e certified solar RECs
  at $24.50 per certificate.
